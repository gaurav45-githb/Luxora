{% extends "base.html" %}
{% block title %}Register — EliteDrive{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <span class="eyebrow">ELITEDRIVE ACCOUNT</span>
        <h1>Create your account.</h1>
        <p>Register before making your luxury car booking.</p>

        <form method="POST">
            <label>
                Full name
                <input name="name" required placeholder="Your full name">
            </label>

            <label>
                Email
                <input name="email" type="email" required placeholder="you@example.com">
            </label>

            <label>
                Phone
                <input name="phone" type="tel" required placeholder="+91">
            </label>

            <label>
                Password
                <input name="password" type="password" required placeholder="Create a password">
            </label>

            <label>
                Confirm password
                <input name="confirm_password" type="password" required placeholder="Confirm your password">
            </label>

            <button class="btn" type="submit">Create Account →</button>
        </form>

        <p class="auth-link">Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </p>
    </div>
</section>
{% endblock %}
