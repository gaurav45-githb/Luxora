{% extends "base.html" %}
{% block title %}Login — EliteDrive{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <span class="eyebrow">ELITEDRIVE ACCOUNT</span>
        <h1>Welcome back.</h1>
        <p>Login to continue with your luxury car booking.</p>

        <form method="POST">
            <label>
                Email
                <input name="email" type="email" required placeholder="you@example.com">
            </label>

            <label>
                Password
                <input name="password" type="password" required placeholder="Your password">
            </label>

            <button class="btn" type="submit">Login →</button>
        </form>

        <p class="auth-link">Don't have an account?
            <a href="{{ url_for('register') }}">Create one</a>
        </p>
    </div>
</section>
{% endblock %}
